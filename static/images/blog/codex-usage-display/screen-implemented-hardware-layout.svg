<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 250 122" role="img" aria-labelledby="title desc">
  <title id="title">Implemented Codex usage display layout</title>
  <desc id="desc">The hardware layout reverses the approved mock: reset information and reset credits are on the left, while percentage remaining, its progress bar, and the last refresh time are on the right.</desc>
  <rect width="250" height="122" fill="#f4f1e5"/>
  <rect width="250" height="18" fill="#111413"/>
  <g fill="#111413" font-family="Menlo, Consolas, monospace">
    <text x="242" y="12.5" text-anchor="end" fill="#f4f1e5" font-size="7" font-weight="700" letter-spacing=".7">CODEX / WEEK</text>
    <line x1="119" y1="26" x2="119" y2="112" stroke="#111413" stroke-width="1"/>

    <text x="9" y="36" font-size="6" font-weight="700" letter-spacing=".35">AUTO RESET IN</text>
    <text x="9" y="61" font-size="23" font-weight="700" letter-spacing="-1">6d 12h</text>
    <text x="9" y="74" font-size="6" font-weight="700" letter-spacing=".35">MON · 9:15 AM</text>
    <line x1="9" y1="84" x2="108" y2="84" stroke="#111413"/>
    <text x="108" y="103" text-anchor="end" font-size="6" font-weight="700" letter-spacing=".35">FULL RESETS</text>
    <text x="9" y="114" font-size="26" font-weight="700">1</text>

    <text x="131" y="63" font-family="Arial Narrow, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">72%</text>
    <text x="241" y="75" text-anchor="end" font-size="7" font-weight="700" letter-spacing=".5">REMAINING</text>
    <rect x="131" y="85" width="110" height="10" fill="none" stroke="#111413" stroke-width="2"/>
    <rect x="134" y="88" width="75" height="4" fill="#111413"/>
    <line x1="186" y1="86" x2="186" y2="94" stroke="#111413" opacity=".45"/>
    <line x1="213" y1="86" x2="213" y2="94" stroke="#111413" opacity=".45"/>
    <text x="241" y="108" text-anchor="end" font-size="5.5" font-weight="700" letter-spacing=".2">LAST REFRESH</text>
    <text x="241" y="118" text-anchor="end" font-size="5.5" font-weight="700" letter-spacing=".2">8:45 PM</text>
  </g>
</svg>
