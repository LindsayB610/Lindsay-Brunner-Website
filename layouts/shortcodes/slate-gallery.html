<section class="slate-carousel" data-slate-carousel aria-roledescription="carousel" aria-label="Slate screenshot gallery">
  <div class="slate-carousel__track" data-slate-carousel-track tabindex="0" aria-label="Slate screenshots. Swipe or use the previous and next buttons to browse.">
    <div class="slate-carousel__slide" aria-roledescription="slide" aria-label="1 of 3">
      <img src="/images/workshop/slate-library.png" alt="Slate’s local reference library, showing explicitly configured reference documents and view types." loading="lazy" decoding="async" />
    </div>
    <div class="slate-carousel__slide" aria-roledescription="slide" aria-label="2 of 3">
      <img src="/images/workshop/slate-codex-skills.png" alt="Slate rendering a configured Markdown reference with tabbed sections." loading="lazy" decoding="async" />
    </div>
    <div class="slate-carousel__slide" aria-roledescription="slide" aria-label="3 of 3">
      <img src="/images/workshop/slate-freezer.png" alt="Slate rendering a sortable freezer inventory table." loading="lazy" decoding="async" />
    </div>
  </div>
  <div class="slate-carousel__controls">
    <div class="slate-carousel__navigation">
      <button class="slate-carousel__button slate-carousel__arrow" type="button" data-slate-carousel-previous aria-label="Show previous Slate screenshot"><span aria-hidden="true">←</span></button>
      <p class="slate-carousel__position" aria-live="polite"><span data-slate-carousel-current>1</span><span aria-hidden="true"> / </span><span class="sr-only">of </span>3</p>
      <button class="slate-carousel__button slate-carousel__arrow" type="button" data-slate-carousel-next aria-label="Show next Slate screenshot"><span aria-hidden="true">→</span></button>
    </div>
    <button class="slate-carousel__button slate-carousel__pause" type="button" data-slate-carousel-pause aria-pressed="false">Pause rotation</button>
  </div>
</section>
<script src="/js/slate-carousel.js"></script>
