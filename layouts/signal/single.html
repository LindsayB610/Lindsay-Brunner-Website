{{ define "main" }}
<article class="section">
  <div class="container-narrow">
    <header style="text-align: center; margin-bottom: 3rem">
      <img
        src="/images/signal-oauth-logo.png"
        alt="Signal logo"
        width="120"
        height="120"
        style="display: block; margin: 0 auto 1.5rem; border-radius: 24px"
      />
      <h1>{{ .Title }}</h1>
      <p
        style="
          font-size: 1.25rem;
          color: var(--dark-text-secondary);
          margin-top: 1.5rem;
        "
      >
        {{ .Params.description }}
      </p>
    </header>

    <div class="article-content">{{ .Content }}</div>
  </div>
</article>
{{ end }}
