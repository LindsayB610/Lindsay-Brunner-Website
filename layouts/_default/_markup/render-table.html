<div class="table-wrapper" role="region" aria-label="Table {{ add .Ordinal 1 }}" tabindex="0">
  <table{{ range $key, $value := .Attributes }}{{ if $value }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}{{ end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
